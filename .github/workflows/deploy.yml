name: CI/CD - Build Docker & Deploy to AWS Lightsail

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Image Name to Lowercase
        id: image_info
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_info.outputs.image }}:latest
            ${{ steps.image_info.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL || '/sign-in' }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL || '/sign-up' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL || '/' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL || '/' }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ secrets.NEXT_PUBLIC_LIVEKIT_URL || 'ws://127.0.0.1:7880' }}

  deploy:
    name: Deploy to AWS Lightsail
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Image Name to Lowercase
        id: image_info
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="$HOME/concord"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Authenticate Docker with GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # Create Caddyfile on the server
            cat << 'EOF' > Caddyfile
            {$DOMAIN_NAME:concord.caducodes.com} {
                reverse_proxy app:3000
            }
            EOF

            # Create docker-compose.yml on the server
            cat << 'EOF' > docker-compose.yml
            services:
              caddy:
                image: caddy:alpine
                container_name: concord-caddy
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                environment:
                  - DOMAIN_NAME=${DOMAIN_NAME:-concord.caducodes.com}
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile
                  - caddy_data:/data
                  - caddy_config:/config
                depends_on:
                  - app
                networks:
                  - concord-network

              postgres:
                image: postgres:16-alpine
                container_name: concord-postgres
                restart: always
                environment:
                  POSTGRES_USER: ${POSTGRES_USER:-postgres}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concord_secret_password}
                  POSTGRES_DB: ${POSTGRES_DB:-concord}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                networks:
                  - concord-network

              app:
                image: ${{ steps.image_info.outputs.image }}:latest
                container_name: concord-app
                restart: always
                depends_on:
                  postgres:
                    condition: service_healthy
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                environment:
                  - PORT=3000
                  - NODE_ENV=production
                  - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-concord_secret_password}@postgres:5432/${POSTGRES_DB:-concord}?schema=public
                networks:
                  - concord-network

            volumes:
              postgres_data:
                driver: local
              caddy_data:
                driver: local
              caddy_config:
                driver: local

            networks:
              concord-network:
                driver: bridge
            EOF

            # Create / Update .env file on the server
            cat << 'EOF' > .env
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME || 'concord.caducodes.com' }}
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'concord_secret_password' }}
            POSTGRES_DB=concord
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL || '/sign-in' }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL || '/sign-up' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL || '/' }}
            NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL || '/' }}
            LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
            LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ secrets.NEXT_PUBLIC_LIVEKIT_URL || 'ws://127.0.0.1:7880' }}
            EOF

            # Pull latest image for the app
            docker compose pull app

            # Run containers (Caddy + Postgres + Concord)
            docker compose up -d --remove-orphans

            # Clean up old unused images
            docker image prune -af --filter "until=24h" || true

            echo "Concord, Caddy HTTPS, and PostgreSQL deployed and running successfully!"
